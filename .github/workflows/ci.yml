name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Check no bytecode committed
        run: |
          if git ls-files '*.pyc' '*.pyo' | grep -q .; then
            echo "Bytecode files must not be committed:"
            git ls-files '*.pyc' '*.pyo'
            exit 1
          fi

      - name: Install package
        run: pip install -e . build

      - name: Compile and package
        run: |
          python -tt -m compileall -f bCNC
          python -m build --sdist

      - name: Run controller tests
        run: python -m unittest discover -s tests/controllers -v
