<html>
<head>
<title>bCNC Pendant</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#222" />

<script type="text/javascript">
	var rpmmax = 12000;
	var WCS = ["G54", "G55", "G56", "G57", "G58", "G59", "G28", "G30", "G92"];
	var WCSVAL = ["wcsx", "wcsy", "wcsz"];

	function $(id) {
		return document.getElementById(id);
	}

	function selectedText(id) {
		var el = $(id);
		return el.options[el.selectedIndex].text;
	}

	function findWcs(x) {
		for (var i = 0; i < WCS.length; i++)
			if (WCS[i] == x) return i;
		return -1;
	}

	function getState() {
		fetch("/state")
			.then(function (r) { return r.json(); })
			.then(function (result) {
				$("state").textContent = result.state;
				$("state").style.backgroundColor = result.color;
				$("msg").textContent = result.msg;
				$("x").textContent = result.wx;
				$("y").textContent = result.wy;
				$("z").textContent = result.wz;
				for (var k = 0; k < result.G.length; k++) {
					if (WCS.indexOf(result.G[k]) > -1)
						$("wcs").value = result.G[k];
					else if (result.G[k] == "M8")
						$("coolant").value = "On";
					else if (result.G[k] == "M3")
						$("spindle").value = "100%";
				}
			})
			.catch(function () {});

		var canvas = $("cnc-canvas");
		if (canvas.complete)
			canvas.src = "/canvas?" + Date.now();
	}

	function getConfig() {
		fetch("/config")
			.then(function (r) { return r.json(); })
			.then(function (result) {
				rpmmax = result.rpmmax;
			})
			.catch(function () {});
	}

	function vibrate(t) {
		if (navigator.vibrate)
			navigator.vibrate(t);
	}

	function sendCmd(command) {
		fetch("/send?" + new URLSearchParams({ cmd: command }));
		vibrate(500);
	}

	function sendGcode(command) {
		fetch("/send?" + new URLSearchParams({ gcode: command }));
		vibrate(50);
	}

	function setWcs() {
		var wcs = $("wcs").value;
		var p = findWcs(wcs);
		var cmd;

		if (p < 6)
			cmd = "G10L20P" + (p + 1);
		else if (p == 6)
			cmd = "G28.1";
		else if (p == 7)
			cmd = "G30.1";
		else if (p == 8)
			cmd = "G92";

		for (var i = 0; i < WCSVAL.length; i++) {
			var x = $(WCSVAL[i]).value;
			if (x != "") {
				cmd += "XYZ"[i] + x;
				$(WCSVAL[i]).value = "";
			}
		}
		sendGcode(cmd + "\n$#\n$G");
	}

	function wcsChange() {
		sendGcode(selectedText("wcs") + "\n$G");
	}

	function spindleChange() {
		var rpm = selectedText("spindle");
		if (rpm == "Off")
			sendGcode("M5");
		else {
			getConfig();
			rpm = (parseInt(rpm, 10) * rpmmax) / 100;
			sendGcode("M3 S" + rpm);
		}
	}

	function coolantChange() {
		var coolant = selectedText("coolant");
		if (coolant == "Off")
			sendGcode("M9");
		else if (coolant == "On")
			sendGcode("M8");
	}

	function sendMove(command) {
		var gcode = "G91G0";
		var step = selectedText("step");
		switch (command) {
			case "O":
				gcode = "G90G0X0Y0Z0";
				break;
			case "XO":
				gcode = "G90G0X0";
				break;
			case "YO":
				gcode = "G90G0Y0";
				break;
			case "ZO":
				gcode = "G90G0Z0";
				break;
			case "XdYu":
				gcode += "X-" + step + "Y" + step;
				break;
			case "Yu":
				gcode += "Y" + step;
				break;
			case "XuYu":
				gcode += "X" + step + "Y" + step;
				break;
			case "Xu":
				gcode += "X" + step;
				break;
			case "Xd":
				gcode += "X-" + step;
				break;
			case "XdYd":
				gcode += "X-" + step + "Y-" + step;
				break;
			case "Yd":
				gcode += "Y-" + step;
				break;
			case "XuYd":
				gcode += "X" + step + "Y-" + step;
				break;
			case "Zu":
				gcode += "Z" + step;
				break;
			case "Zd":
				gcode += "Z-" + step;
				break;
			default:
				break;
		}
		sendGcode(gcode);
		sendGcode("G90");
	}

	function sendManualCmd() {
		sendCmd(encodeURIComponent($("cmd").value));
		$("cmd").value = "";
	}

	function fileChange() {
		fetch("/upload", {
			method: "POST",
			body: new FormData($("upload-file")),
		});
	}

	document.addEventListener("DOMContentLoaded", function () {
		sendGcode("$#\n$G\n");
		getConfig();
		setInterval(getState, 1000);
	});
</script>

<style type="text/css">
	* { box-sizing: border-box; }
	body {
		margin: 0;
		padding: 8px;
		font-family: system-ui, sans-serif;
	}
	h1 { text-align: center; }

	/* Minimal flex grid (replaces Pure.css) */
	.row {
		display: flex;
		flex-wrap: wrap;
		width: 100%;
	}
	.u-1 { width: 100%; }
	.u-1-2 { width: 50%; }
	.u-1-3 { width: 33.333%; }
	.u-1-4 { width: 25%; }
	.u-1-6 { width: 16.666%; }

	.command {
		width: 100%;
		height: 32px;
	}
	.large {
		text-align: center;
		font-size: 22px;
		color: DarkBlue;
	}
	.medium {
		text-align: center;
		font-size: 18px;
		color: DarkGreen;
	}
	.border > div {
		border: 1px solid #999;
	}
	.hdr {
		font-weight: bold;
		font-size: 1.1em;
		height: 30px;
	}
	.direction {
		width: 100%;
		height: 64px;
	}
	.bold { font-weight: bold; }
	.center { text-align: center; }
	input[type="number"] { width: 15%; }
	img.canvas {
		display: block;
		margin: 0 auto;
		object-fit: scale-down;
	}
	button {
		touch-action: manipulation;
	}
</style>
</head>

<body>
	<h1>bCNC Pendant</h1>

	<div class="row">
		<div class="u-1-3"><button type="button" onclick="sendCmd('HOME');" class="command">Home</button></div>
		<div class="u-1-3"><button type="button" onclick="sendCmd('UNLOCK');" class="command">Unlock</button></div>
		<div class="u-1-3"><button type="button" onclick="sendCmd('RESET');" class="command">Reset</button></div>
	</div>
	<br />
	<div class="row border">
		<div class="u-1 large" id="state" style="border-bottom:0;">Status&nbsp;</div>
	</div>
	<div class="row border">
		<div class="u-1 medium" id="msg" style="border-bottom:0;">Message&nbsp;</div>
	</div>

	<div class="row border">
		<div class="u-1-3 large">X: <span id="x">&nbsp;</span></div>
		<div class="u-1-3 large">Y: <span id="y">&nbsp;</span></div>
		<div class="u-1-3 large">Z: <span id="z">&nbsp;</span></div>
	</div>
	<br />
	<div class="row">
		<div class="u-1-3"><button type="button" onclick="sendCmd('RUN');" class="command">Run</button></div>
		<div class="u-1-3"><button type="button" onclick="sendCmd('PAUSE');" class="command">Pause</button></div>
		<div class="u-1-3"><button type="button" onclick="sendCmd('STOP');" class="command">Stop</button></div>
	</div>

	<div class="row border">
		<img src="/canvas" id="cnc-canvas" class="canvas" alt="CNC canvas" />
	</div>

	<br />
	<div class="row"><div class="u-1 hdr">Machine Control</div></div>

	<div class="row">
		<div class="u-1-4">
			Spindle:
			<select id="spindle" onchange="spindleChange();">
				<option value="Off" selected>Off</option>
				<option value="25%">25%</option>
				<option value="50%">50%</option>
				<option value="75%">75%</option>
				<option value="100%">100%</option>
			</select>
		</div>
		<div class="u-1-4">
			Coolant:
			<select id="coolant" onchange="coolantChange();">
				<option value="Off" selected>Off</option>
				<option value="On">On</option>
			</select>
		</div>
	</div>
	<br />

	<div class="row">
		<div class="u-1-2">
			<span>Command:</span>
			<input id="cmd" style="width:75%" />
			<button type="button" onclick="sendManualCmd();">Send</button>
		</div>
		<div class="u-1-2">
			<form id="upload-file" style="width:75%" enctype="multipart/form-data">
				Select file to upload:
				<input name="file" type="file" onchange="fileChange();" />
			</form>
		</div>
	</div>

	<br />
	<div class="row"><div class="u-1 hdr">Work Coordinates</div></div>
	<div class="row">
		<div class="u-1">
			<select id="wcs" onchange="wcsChange();">
				<option value="G54" selected>G54</option>
				<option value="G55">G55</option>
				<option value="G56">G56</option>
				<option value="G57">G57</option>
				<option value="G58">G58</option>
				<option value="G59">G59</option>
				<option value="G28">G28</option>
				<option value="G30">G30</option>
				<option value="G92">G92</option>
			</select>
			<span style="padding-left:10px;">X: </span><input id="wcsx" type="number" />
			<span style="padding-left:10px;">Y: </span><input id="wcsy" type="number" />
			<span style="padding-left:10px;">Z: </span><input id="wcsz" type="number" />
			<button type="button" onclick="setWcs();">Set</button>
		</div>
	</div>

	<br />
	<div class="row"><div class="u-1 hdr">Jogging</div></div>

	<div class="row">
		<div class="u-1-6 bold center"><button type="button" onclick="sendMove('ZO')" class="direction">Z 0</button></div>
		<div class="u-1-3">&nbsp;</div>
		<div class="u-1-6 bold center"><button type="button" onclick="sendMove('YO')" class="direction">Y 0</button></div>
	</div>

	<div class="row">
		<div class="u-1-6"><button type="button" onclick="sendMove('Zu')" class="direction">&#x25B2;</button></div>
		<div class="u-1-6">&nbsp;</div>
		<div class="u-1-6"><button type="button" onclick="sendMove('XdYu')" class="direction">&#x25F8;</button></div>
		<div class="u-1-6"><button type="button" onclick="sendMove('Yu')" class="direction">&#x25B2;</button></div>
		<div class="u-1-6"><button type="button" onclick="sendMove('XuYu')" class="direction">&#x25F9;</button></div>
	</div>

	<div class="row">
		<div class="u-1-6 center">
			<select id="step" style="margin-top:21px;">
				<option value="0.001">0.001</option>
				<option value="0.005">0.005</option>
				<option value="0.01">0.01</option>
				<option value="0.02">0.02</option>
				<option value="0.05">0.05</option>
				<option value="0.1">0.1</option>
				<option value="0.2">0.2</option>
				<option value="0.5">0.5</option>
				<option value="1" selected>1</option>
				<option value="2">2</option>
				<option value="5">5</option>
				<option value="10">10</option>
				<option value="20">20</option>
				<option value="50">50</option>
				<option value="100">100</option>
				<option value="500">500</option>
			</select>
		</div>
		<div class="u-1-6 bold center"><button type="button" onclick="sendMove('XO')" class="direction">X 0</button></div>
		<div class="u-1-6"><button type="button" onclick="sendMove('Xd')" class="direction">&#x25C0;</button></div>
		<div class="u-1-6 center"><button type="button" onclick="sendMove('O')" class="direction">&#x25EF;</button></div>
		<div class="u-1-6"><button type="button" onclick="sendMove('Xu')" class="direction">&#x25b6;</button></div>
	</div>

	<div class="row">
		<div class="u-1-6"><button type="button" onclick="sendMove('Zd')" class="direction">&#x25BC;</button></div>
		<div class="u-1-6">&nbsp;</div>
		<div class="u-1-6"><button type="button" onclick="sendMove('XdYd')" class="direction">&#x25FA;</button></div>
		<div class="u-1-6"><button type="button" onclick="sendMove('Yd')" class="direction">&#x25BC;</button></div>
		<div class="u-1-6"><button type="button" onclick="sendMove('XuYd')" class="direction">&#x25FF;</button></div>
	</div>
</body>
</html>
