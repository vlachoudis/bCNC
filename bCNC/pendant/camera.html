<html>
<head>
<title>bCNC Pendant</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#222" />

<script type="text/javascript">
	var rpmmax = 12000;
	var WCS = ["G54", "G55", "G56", "G57", "G58", "G59", "G28", "G30", "G92"];
	var imageUpdate = 1;
	var stateCount = imageUpdate;
	var _count = 0;

	function $(id) {
		return document.getElementById(id);
	}

	function getState() {
		fetch("/state")
			.then(function (r) { return r.json(); })
			.then(function (result) {
				$("state").textContent = result.state;
				$("state").style.backgroundColor = result.color;
				$("msg").textContent = result.msg;
				$("x").textContent = result.wx;
				$("y").textContent = result.wy;
				$("z").textContent = result.wz;
			})
			.catch(function () {});

		if (stateCount-- <= 0) {
			$("camera").src = "/camera?_=" + _count++;
			stateCount = imageUpdate;
		}
	}

	function getConfig() {
		fetch("/config")
			.then(function (r) { return r.json(); })
			.then(function (result) {
				rpmmax = result.rpmmax;
			})
			.catch(function () {});
	}

	function vibrate(t) {
		if (navigator.vibrate)
			navigator.vibrate(t);
	}

	function sendCmd(command) {
		fetch("/send?" + new URLSearchParams({ cmd: command }));
		vibrate(500);
	}

	function sendGcode(command) {
		fetch("/send?" + new URLSearchParams({ gcode: command }));
		vibrate(50);
	}

	document.addEventListener("DOMContentLoaded", function () {
		sendGcode("$#\n$G\n");
		getConfig();
		setInterval(getState, 1000);
	});
</script>

<style type="text/css">
	* { box-sizing: border-box; }
	body {
		margin: 0;
		padding: 8px;
		font-family: system-ui, sans-serif;
	}
	h1 { text-align: center; }

	.row {
		display: flex;
		flex-wrap: wrap;
		width: 100%;
	}
	.u-1 { width: 100%; }
	.u-1-3 { width: 33.333%; }

	.command {
		width: 100%;
		height: 32px;
	}
	.large {
		text-align: center;
		font-size: 22px;
		color: DarkBlue;
	}
	.medium {
		text-align: center;
		font-size: 18px;
		color: DarkGreen;
	}
	.border > div {
		border: 1px solid #999;
	}
	#camera {
		display: block;
		margin: 0 auto;
		max-width: 100%;
	}
	button {
		touch-action: manipulation;
	}
</style>
</head>

<body>
	<h1>bCNC Pendant</h1>

	<div class="row">
		<div class="u-1-3">
			<button type="button" onclick="sendCmd('HOME');" class="command" disabled>Home</button>
		</div>
		<div class="u-1-3">
			<button type="button" onclick="sendCmd('UNLOCK');" class="command" disabled>Unlock</button>
		</div>
		<div class="u-1-3">
			<button type="button" onclick="sendCmd('RESET');" class="command" disabled>Reset</button>
		</div>
	</div>
	<br />
	<div class="row border">
		<div class="u-1 large" id="state" style="border-bottom:0;">Status&nbsp;</div>
	</div>
	<div class="row border">
		<div class="u-1 medium" id="msg" style="border-bottom:0;">Message&nbsp;</div>
	</div>

	<div class="row border">
		<div class="u-1-3 large">X: <span id="x">&nbsp;</span></div>
		<div class="u-1-3 large">Y: <span id="y">&nbsp;</span></div>
		<div class="u-1-3 large">Z: <span id="z">&nbsp;</span></div>
	</div>
	<br />
	<div class="row">
		<div class="u-1-3">
			<button type="button" onclick="sendCmd('RUN');" class="command">Run</button>
		</div>
		<div class="u-1-3">
			<button type="button" onclick="sendCmd('PAUSE');" class="command">Pause</button>
		</div>
		<div class="u-1-3">
			<button type="button" onclick="sendCmd('STOP');" class="command">Stop</button>
		</div>
	</div>

	<br />
	<div class="row">
		<img id="camera" src="/camera" alt="Camera" />
	</div>
</body>
</html>
